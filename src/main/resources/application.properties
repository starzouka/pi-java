app.name=PULSE Desktop JavaFX
# Chemin vers le projet Symfony (pour lire .env / .env.local).
# Par defaut: dossier parent du projet JavaFX.
app.web.root=..
app.web.base-url=http://127.0.0.1:8000
verify.email.lifetime.seconds=86400
reset.password.lifetime.seconds=3600

# Optional: IA assistant endpoint (JSON).
# Example:
# ai.endpoint=http://127.0.0.1:8000/api/ai/chat
# ai.api-key=YOUR_KEY
# Dev-only: you can also point to the embedded mock endpoint (started with the app):
# ai.endpoint=http://127.0.0.1:8000/api/ai/chat

# Optional: base URL used inside generated QR codes (phone-friendly).
# If not set, it uses app.web.base-url. If app.web.base-url is localhost/127.0.0.1,
# the app will try to replace it with your LAN IP automatically (ex: 192.168.x.x).
# Example:
# qr.base-url=http://192.168.1.10:8000

# QR web server embedded in JavaFX app (to make phone QR scan work without Symfony).
# Default port: 8000
# qr.server.enabled=true
# qr.server.port=8000
# By default this matches the Symfony .env file in your web project.
db.host=127.0.0.1
db.port=3306
db.name=newpulse
db.user=root
db.password=
db.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
